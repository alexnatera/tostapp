services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tostapp
      POSTGRES_USER: tostapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tostapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://tostapp:${POSTGRES_PASSWORD}@db:5432/tostapp
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://tostapp.tugtools.online}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://tostapp.tugtools.online}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tostapp.rule=Host(`tostapp.tugtools.online`)"
      - "traefik.http.routers.tostapp.entrypoints=web"
      - "traefik.http.services.tostapp.loadbalancer.server.port=80"

volumes:
  postgres_data:

networks:
  internal:
  proxy:
    external: true
